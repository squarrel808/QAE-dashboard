<script>
(() => {
  'use strict';
  const dates=DATA.dates, times=dates.map(d=>Date.parse(d+'T00:00:00Z'));
  const groups=DATA.groups, selected=new Set(groups.map(g=>g.key));
  let mode='Expanded', period='all';
  const W=1120,H=240,L=58,R=18,T=12,B=28;
  const $=id=>document.getElementById(id);
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatDate=s=>s?s.slice(2,7).replace('-','.'):'';
  const formatFullDate=s=>s?s.replaceAll('-','.'):'';
  const formatValue=(key,x)=>x==null?'—':key==='pe'?x.toFixed(1)+'배':x.toFixed(1);
  function startIndex(){
    if(period==='all') return 0;
    const end=times[times.length-1],months=period==='1y'?12:6;
    const d=new Date(end);d.setUTCMonth(d.getUTCMonth()-months);
    const target=d.getTime();let i=times.findIndex(x=>x>=target);return i<0?0:i;
  }
  function renderList(){
    $('groupList').innerHTML=groups.map(g=>{
      const row=g.modes[mode],i=dates.length-1;
      const p=row.price[i],e=row.eps[i],pe=row.pe[i];
      return `<button type="button" class="group" data-key="${escape(g.key)}" aria-pressed="${selected.has(g.key)}" title="${escape(g.description)}"><span class="swatch" style="background:${g.color}"></span><span class="group-name">${escape(g.short)}<span class="group-meta">${row.members}종목 · 가격 ${formatValue('price',p)} · EPS ${formatValue('eps',e)} · P/E ${formatValue('pe',pe)}</span></span></button>`;
    }).join('');
  }
  function nearestIndex(t,lo,hi){let a=lo,b=hi;while(a<b){const m=(a+b)>>1;if(times[m]<t)a=m+1;else b=m;}if(a<=lo)return lo;if(a>hi)return hi;return Math.abs(times[a]-t)<Math.abs(times[a-1]-t)?a:a-1;}
  function drawMetric(key){
    const svg=$(key+'Chart'),meta=$(key+'Meta'),wrap=$(key+'Wrap'),tip=wrap.querySelector('.chart-tooltip');
    const lo=startIndex(),hi=dates.length-1,visible=groups.filter(g=>selected.has(g.key));
    const points=[];
    for(const g of visible){const v=g.modes[mode][key];for(let i=lo;i<=hi;i++)if(v[i]!=null&&Number.isFinite(v[i]))points.push(v[i]);}
    let yMin=Math.min(...points),yMax=Math.max(...points);
    if(!points.length){svg.innerHTML='';meta.textContent='선택한 밸류체인의 유효 데이터 없음';tip.hidden=true;return;}
    if(key!=='pe'){yMin=Math.min(yMin,100);yMax=Math.max(yMax,100);}
    let spread=yMax-yMin;if(spread<1)spread=Math.max(1,Math.abs(yMax)*.05);
    yMin-=spread*.10;yMax+=spread*.10;
    if(key==='pe')yMin=Math.max(0,yMin);
    const left=times[lo],right=times[hi],delta=Math.max(1,right-left);
    const x=i=>L+(times[i]-left)/delta*(W-L-R);
    const y=v=>T+(yMax-v)/(yMax-yMin)*(H-T-B);
    const parts=[`<rect x="0" y="0" width="${W}" height="${H}" fill="white"/>`];
    for(let k=0;k<=4;k++){
      const value=yMin+(yMax-yMin)*k/4,yy=y(value);
      parts.push(`<line class="grid-line" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis-label" x="${L-8}" y="${yy+4}" text-anchor="end">${key==='pe'?value.toFixed(1)+'x':value.toFixed(0)}</text>`);
    }
    if(key!=='pe'&&yMin<=100&&yMax>=100)parts.push(`<line class="base-line" x1="${L}" x2="${W-R}" y1="${y(100)}" y2="${y(100)}"/>`);
    for(let k=0;k<=5;k++){const i=lo+Math.round((hi-lo)*k/5),xx=x(i);parts.push(`<line class="axis-line" x1="${xx}" x2="${xx}" y1="${H-B}" y2="${H-B+4}"/><text class="axis-label" x="${xx}" y="${H-5}" text-anchor="middle">${formatDate(dates[i])}</text>`);}
    for(const g of visible){
      const values=g.modes[mode][key];let path='',open=false;
      for(let i=lo;i<=hi;i++){
        const v=values[i];if(v==null||!Number.isFinite(v)){open=false;continue;}
        path+=(open?'L':'M')+x(i).toFixed(2)+' '+y(v).toFixed(2);open=true;
      }
      if(path)parts.push(`<path d="${path}" fill="none" stroke="${g.color}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);
    }
    parts.push(`<line class="crosshair" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#55657a" stroke-dasharray="3 3" visibility="hidden"/>`);
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=parts.join('');
    meta.textContent=`${formatFullDate(dates[lo])}–${formatFullDate(dates[hi])} · ${visible.length}개 표시`;
    const cross=svg.querySelector('.crosshair');
    svg.onmousemove=ev=>{
      const rect=svg.getBoundingClientRect(),vx=(ev.clientX-rect.left)/rect.width*W;
      if(vx<L||vx>W-R){tip.hidden=true;cross.setAttribute('visibility','hidden');return;}
      const t=left+(vx-L)/(W-L-R)*delta,i=nearestIndex(t,lo,hi),xx=x(i);
      cross.setAttribute('x1',xx);cross.setAttribute('x2',xx);cross.setAttribute('visibility','visible');
      const rows=visible.map(g=>{const row=g.modes[mode],v=row[key][i],c=row.coverage[key][i];return v==null?'':`<div class="tip-row"><span class="tip-name" style="color:${g.color}">${escape(g.short)}</span><span>${formatValue(key,v)} <span class="tip-muted">${c==null?'':Math.round(c*100)+'%'}</span></span></div>`;}).filter(Boolean);
      tip.innerHTML=`<b>${formatFullDate(dates[i])}</b><div class="tip-muted">오른쪽 숫자는 데이터 커버리지</div>${rows.join('')||'<div>유효값 없음</div>'}`;
      tip.hidden=false;tip.style.left=Math.min(rect.width-170,Math.max(6,ev.clientX-rect.left+12))+'px';tip.style.top=Math.max(4,Math.min(rect.height-75,ev.clientY-rect.top-15))+'px';
    };
    svg.onmouseleave=()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');};
  }
  function redraw(){renderList();for(const key of ['price','eps','pe'])drawMetric(key);}
  $('groupList').addEventListener('click',ev=>{const item=ev.target.closest('[data-key]');if(!item)return;const k=item.dataset.key;selected.has(k)?selected.delete(k):selected.add(k);redraw();});
  $('showAll').onclick=()=>{groups.forEach(g=>selected.add(g.key));redraw();};
  $('hideAll').onclick=()=>{selected.clear();redraw();};
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));redraw();});
  document.querySelectorAll('[data-range]').forEach(btn=>btn.onclick=()=>{period=btn.dataset.range;document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===btn));redraw();});
  $('dateBadge').textContent=`${formatFullDate(DATA.meta.firstSession)}–${formatFullDate(DATA.meta.lastSession)} · ${DATA.meta.sessions}거래일`;
  $('methodNote').textContent=`원천: ${DATA.meta.source} / ${DATA.meta.sourceSheet} (${DATA.meta.currency}). 현재 S&P 500 구성종목과 기존 AI 밸류체인 분류를 과거에 고정 적용합니다. 가격은 종목별 시총÷주가로 주식수를 복원해 주식수 가중 바스켓 가격을 연결하고 배당은 제외합니다. EPS는 같은 주식수로 가중한 12MF Blended EPS, P/E는 유효 종목의 시총가중 earnings yield 역수입니다. 가격·EPS는 각 밸류체인의 첫 유효 거래일=100이며, 시작점이 서로 다를 수 있습니다. EPS/P/E 커버리지가 당일 그룹 시총의 60% 미만이면 표시하지 않습니다. P/E 1배 미만·200배 초과는 이상치로 제외합니다. P/E는 가격과 EPS의 단순 비율 또는 종목 P/E 산술평균이 아니며, 세 지표의 유효 종목 집합이 달라 값이 정확히 맞물리지 않을 수 있습니다.`;
  redraw();
})();
