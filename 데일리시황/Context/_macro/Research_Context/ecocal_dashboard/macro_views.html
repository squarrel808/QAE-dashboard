<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IB 거시 맥락 뷰 · 성장·물가·통화정책</title>
<meta name="description" content="국가별 GS·JPM·Citi·BofA·HSBC의 성장·물가·통화정책 견해, 전제와 변경 이력">
<style>
:root{--ink:#1c302c;--muted:#60716b;--green:#225746;--line:#d9e2dc;--paper:#f6f7f2;--soft:#eaf2e9;--amber:#825d25}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.7 'Segoe UI','Malgun Gothic',sans-serif}header{background:#163930;color:white;padding:20px 32px}header a{color:#d3e6d8}header nav{display:flex;gap:20px;flex-wrap:wrap;font-size:14px}h1{font-size:26px;letter-spacing:-.7px;margin:10px 0 0}main{max-width:1680px;margin:auto;padding:24px 32px}a{color:var(--green);overflow-wrap:anywhere}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #a98733;outline-offset:3px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 22px}.controls button{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 18px}.controls button[aria-pressed="true"]{background:var(--green);color:white;border-color:var(--green)}.notice{background:#fffaf0;border-left:4px solid #b99759;padding:12px 16px;font-size:14px}.notice p{margin:4px 0}.muted{color:var(--muted);font-size:13px;line-height:1.7}.statusline{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:12px 0}.statusline h2{font-size:21px;margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}table{border-collapse:collapse;width:100%;min-width:1030px;table-layout:fixed}thead th{background:#e8efea;padding:15px 18px;text-align:left;font-size:17px;position:sticky;top:0;z-index:2}th:first-child{width:94px}tbody th{padding:22px 16px;vertical-align:top;background:#f1f5ef;border-top:1px solid var(--line);font-size:18px}td{padding:17px;vertical-align:top;border-left:1px solid var(--line);border-top:1px solid var(--line)}.view+.view{border-top:1px dashed var(--line);padding-top:16px;margin-top:18px}.view h3{font-size:14px;margin:0 0 6px;color:var(--green)}.view p{margin:6px 0 10px;font-size:16px;line-height:1.85}.tag{display:inline-block;border-radius:4px;padding:2px 6px;background:#edf1eb;font-size:12px}.tag.old{background:#fff0d5;color:var(--amber)}.tag.conflict{background:#f9e6e2;color:#8b3c2a}.sources{margin:8px 0;line-height:1.5}.source-title{display:block;margin:4px 0;font-size:13px}.context{border-left:3px solid #a3b7a5;padding-left:10px;margin:12px 0;font-size:14px}.context p{font-size:14px;margin:3px 0;line-height:1.7}details{margin:9px 0;font-size:14px}summary{cursor:pointer;color:var(--green)}blockquote{margin:10px 0;padding:0 12px;border-left:2px solid var(--line);font-size:13px;color:var(--muted);white-space:normal;overflow-wrap:anywhere}.limit{font-size:13px;color:#805d32}.empty{color:var(--muted);font-size:14px;margin:5px 0}.history{padding:10px;background:#f4f6f0;margin:7px 0}.history p{font-size:14px}.footer{margin-top:24px}.footer p{font-size:14px}.forecast-list{padding-left:20px}.forecast-list li{margin:12px 0}ul{padding-left:20px}.scope{font-size:12px;color:var(--muted)}@media(max-width:700px){header,main{padding:18px}h1{font-size:23px}.controls button{padding:7px 12px}table{min-width:950px}th:first-child{width:80px}td{padding:13px}}
</style></head><body>
<header><nav aria-label="대시보드 이동"><a href="__MAIN_HREF__">← INDEX 대시보드</a><a href="index.html">지표별 요약·IB 코멘트</a><span aria-current="page">IB 거시 맥락 뷰</span></nav><h1>IB 거시 맥락 뷰</h1></header>
<main>
<div class="notice"><p id="dateNote"></p><p id="scopeNote"></p></div>
<nav class="controls" id="countries" aria-label="국가·지역 선택"></nav>
<div class="statusline"><h2 id="countryTitle"></h2><span class="muted" id="counts"></span></div>
<div class="tablewrap"><table aria-label="IB별 성장 물가 통화정책 비교"><thead><tr><th scope="col">IB</th><th scope="col">Growth · 성장</th><th scope="col">Inflation · 물가</th><th scope="col">통화정책</th></tr></thead><tbody id="rows"></tbody></table></div>
<details class="footer"><summary>저장된 수치 전망 — 대상 기간과 작성일 확인</summary><div id="forecasts"></div></details>
<details class="footer"><summary>범위와 읽는 기준</summary><div id="method"></div></details>
</main>
<script id="macroData" type="application/json">__MACRO_VIEW_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('macroData').textContent),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let country=DATA.countries.some(c=>c.code==='US')?'US':DATA.countries[0]?.code;
function sources(refs){const byPage=new Map(refs.map(x=>[x.doc_id+':'+x.page,x]));return `<div class="sources">${[...byPage.values()].map(x=>`<a class="source-title" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="muted">발행 ${esc(x.published_metadata)} · ${x.page}쪽</span>`).join('<br>')}</div>`}
function quotes(refs){return `<details><summary>원문 근거 보기</summary>${refs.map(x=>`<blockquote>${esc(x.quote)}</blockquote>`).join('')}</details>`}
function context(v){const parts=[];if(v.assumptions.length)parts.push(`<p><b>핵심 전제</b> ${v.assumptions.map(esc).join(' / ')}</p>`);if(v.analyst_questions.length)parts.push(`<p><b>확인할 조건</b> ${v.analyst_questions.map(esc).join(' / ')}</p>`);return parts.length?`<div class="context">${parts.join('')}</div>`:''}
function history(g){if(!g.history.length)return '';return `<details><summary>이 쟁점의 이전 뷰 ${g.history.length}건</summary>${g.history.map(v=>`<div class="history"><b>${esc(v.effective_date)}</b><p>${esc(v.summary)}</p><div class="muted">${esc(v.change_label)} · ${esc(v.change_note)}</div>${sources(v.evidence)}${quotes(v.evidence)}</div>`).join('')}</details>`}
function view(v,g){const prior=g.history.find(x=>x.view_id===v.prior_view_id);return `<article class="view"><h3>${esc(v.track_label)}${v.track==='rates.outlook'?' · 정책금리 결정과 구분':''}</h3><div><span class="tag">검토 뷰 ${esc(v.effective_date)}</span> ${v.age_days>21?`<span class="tag old">${v.age_days}일 경과</span>`:''}${g.conflict?' <span class="tag conflict">같은 날짜의 복수 뷰</span>':''}</div><p>${esc(v.summary)}</p>${context(v)}${prior?`<div class="context"><p><b>이전 → 현재</b> ${esc(v.change_label)}</p><p>${esc(prior.effective_date)}: ${esc(prior.summary)}</p><p>${esc(v.change_note)}</p></div>`:`<div class="muted">${esc(v.change_label)}${v.change_note?' · '+esc(v.change_note):''}</div>`}${v.limitations.map(t=>`<div class="limit">유의: ${esc(t)}</div>`).join('')}<div class="scope">${esc(v.scope_label)}${v.storage_layer==='calendar_supplement'?' · 지표 분석에서 보강한 저장 뷰':''}</div>${sources(v.evidence)}${quotes(v.evidence)}</article>`}
function render(){
  const groups=DATA.groups.filter(g=>g.country===country),current=groups.flatMap(g=>g.views);
  $('countries').innerHTML=DATA.countries.map(c=>`<button data-country="${esc(c.code)}" aria-pressed="${c.code===country}">${esc(c.label)}</button>`).join('');
  $('countryTitle').textContent=DATA.countries.find(c=>c.code===country)?.label||'';
  $('counts').textContent=`저장된 현재 뷰 ${current.length}건 · 이전 뷰 ${groups.reduce((n,g)=>n+g.history.length,0)}건`;
  $('rows').innerHTML=DATA.houses.map(h=>`<tr><th scope="row">${esc(h)}</th>${Object.keys(DATA.themes).map(theme=>{const chosen=groups.filter(g=>g.house===h&&g.theme===theme);return `<td>${chosen.length?chosen.map(g=>g.views.map(v=>view(v,g)).join('')+history(g)).join(''):'<p class="empty">이 영역의 저장된 직접 뷰가 없습니다.</p>'}</td>`}).join('')}</tr>`).join('');
  const fs=DATA.forecasts.filter(f=>f.country===country);
  $('forecasts').innerHTML=fs.length?`<p class="muted">아래는 해당 작성일의 사전 전망입니다. 현재 실제값이나 새 전망으로 해석하지 않습니다.</p><ul class="forecast-list">${fs.map(f=>`<li><b>${esc(f.house)}</b> · ${esc(f.indicator)} · 대상 ${esc(f.reference_period)} · ${esc(f.value)} ${esc(f.unit)}<br><span class="muted">작성 ${esc(f.as_of)} · 시나리오 ${esc(f.scenario)} ${f.conflict?'· 복수 전망':''}</span>${sources(f.evidence)}${quotes(f.evidence)}</li>`).join('')}</ul>`:'<p class="empty">이 지역의 저장된 수치 전망은 없습니다.</p>';
}
$('dateNote').textContent=`저장 뷰 최신 기준일 ${DATA.meta.latest_view_date} · 검색 DB의 최신 보고서 ${DATA.meta.latest_indexed_report_date} · 화면 구성 ${DATA.meta.as_of}`;
$('scopeNote').textContent=DATA.meta.note+' 모두 사용자 검토 전 초안입니다.';
$('method').innerHTML=`<p>각 IB의 견해를 국가·쟁점별로 묶었습니다. 해당 쟁점의 마지막 저장 뷰와 전제·위험·변경 이력을 보여주며, 하우스 간 의견을 임의의 합의로 합치지 않았습니다.</p><p>Growth에는 성장·소비·고용·주택·생산성, Inflation에는 물가 경로·지표 전망·에너지 위험을 모았습니다. 통화정책에는 기본 금리 경로·정책 판단 조건을 담고 시장금리 전망은 별도로 표시합니다. 에너지 위험은 근원물가 전망과 같은 뜻이 아닙니다.</p><p>유로존 뷰를 독일·프랑스·이탈리아의 독립 뷰로 복제하지 않습니다. 자료가 없는 칸은 공백으로 두며, 오래된 뷰의 경과일 표시는 만료나 전망 변경을 의미하지 않습니다.</p><p>${DATA.meta.current_views}개 현재 뷰 · ${DATA.meta.prior_views}개 과거 뷰 · ${DATA.meta.source_documents}개 근거 보고서. 최근 지표별 요약·코멘트는 상단의 별도 메뉴에 그대로 남아 있습니다.</p>`;
$('countries').addEventListener('click',e=>{const b=e.target.closest('[data-country]');if(b&&DATA.countries.some(c=>c.code===b.dataset.country)){country=b.dataset.country;render()}});
render();
</script></body></html>
