<style>
:root{
  --page-bg:#f7f6f3;--card-bg:#ffffff;--text-main:#1a1c1f;--text-muted:#5a5f66;

}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-base);background:var(--page-bg);color:var(--text-main);padding:24px 32px}
h1{font-size:22px;font-weight:600;color:var(--text-main);margin-bottom:4px;font-family:Georgia,serif}
.sub{font-size:13px;color:var(--text-muted);margin-bottom:24px}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.header-left{flex:1}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.year-toggle{display:flex;gap:4px}
.year-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);font:600 14px var(--font-base);padding:9px 13px;border-radius:8px;cursor:pointer}
.year-btn:hover{border-color:var(--text-muted)}
.year-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.country-select{background:var(--card-bg);border:1px solid var(--border);color:var(--text-main);font-family:var(--font-base);font-size:14px;font-weight:500;padding:10px 16px;border-radius:8px;cursor:pointer;outline:none;min-width:180px}
.country-select:hover{border-color:var(--text-muted)}
.country-select:focus{border-color:var(--accent)}
.country{margin-bottom:28px}
.country.hidden{display:none}
.ctitle{font-size:16px;font-weight:600;color:var(--text-main);margin-bottom:8px;font-family:Georgia,serif}
.row{display:flex;gap:12px;flex-wrap:wrap}
.panel{flex:1;min-width:500px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:16px 14px 10px}
.plabel{font-size:16px;font-weight:600;color:var(--text-main);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
canvas{width:100%;height:auto}
</style>
</head>

function kde(data,lo,hi,n,bw){
  const r=[];
  const safeBw=Math.max(bw||0, 0.01);
  const s=(hi-lo)/(n-1||1);
  for(let i=0;i<n;i++){
    const x=lo+i*s;
    let v=0;
    for(const d of data){
      const z=(x-d)/safeBw;
      v+=Math.exp(-0.5*z*z);
    }
    r.push({x,y:v/(data.length*safeBw*Math.sqrt(2*Math.PI))});
  }
  return r;
}

function fky(c,x){
  let b=c[0];
  for(const p of c) if(Math.abs(p.x-x)<Math.abs(b.x-x)) b=p;
  return b.y;
}

function gc(i,N){
  const t=N>1?i/(N-1):0;
  const idx=t*(CL.length-1);
  const lo=Math.floor(idx),hi=Math.min(lo+1,CL.length-1),f=idx-lo;
  return [
    Math.round(CL[lo][0]+(CL[hi][0]-CL[lo][0])*f),
    Math.round(CL[lo][1]+(CL[hi][1]-CL[lo][1])*f),
    Math.round(CL[lo][2]+(CL[hi][2]-CL[lo][2])*f)
  ];
}

function percentile(arr,p){
  if(!arr.length) return null;
  const a=[...arr].sort((x,y)=>x-y);
  const pos=(a.length-1)*p;
  const lo=Math.floor(pos), hi=Math.ceil(pos);
  if(lo===hi) return a[lo];
  return a[lo] + (a[hi]-a[lo])*(pos-lo);
}

function buildRidgeState(items,bw){
  const N=items.length;
  if(!N) return null;

  const trimmedItems=items.map(it=>{
    const sv=[...it.values].sort((a,b)=>a-b);
    const tv=sv.length>2?sv.slice(1,-1):sv;
    return {date:it.date, values:it.values, trimmed:tv};
  });

  const allTrimmed=trimmedItems.flatMap(it=>it.trimmed).filter(v=>Number.isFinite(v));
  if(!allTrimmed.length) return null;
  const tMin=Math.min(...allTrimmed), tMax=Math.max(...allTrimmed);
  const spread=Math.max(tMax-tMin, 0.2);
  const pad=spread*0.25;
  const xL=tMin-pad;
  const xH=tMax+pad;

  let maxY=0;
  const curves=trimmedItems.map(it=>{
    const c=kde(it.trimmed,xL,xH,250,bw);
    for(const p of c) if(p.y>maxY) maxY=p.y;
    return c;
  });

  return {items:trimmedItems,bw,xL,xH,maxY,curves};
}

    const div=document.createElement('div');div.className='country';div.dataset.country=c;
    const lastN=d['2w']&&d['2w'].length?d['2w'][d['2w'].length-1].values.length:0;
    div.innerHTML=`<div class="ctitle">${nm} (${c})</div><div class="row"><div class="panel"><div class="plabel">2W chg (daily, weekdays)</div><div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">#${lastN}</div><canvas id="a_${uid}"></canvas></div><div class="panel"><div class="plabel">6M chg (bi-weekly)</div><canvas id="b_${uid}"></canvas></div><div class="panel"><div class="plabel">Median + IQR (daily)</div><div class="median-ranges" style="display:flex;gap:4px;margin-bottom:8px"></div><canvas id="m_${uid}"></canvas></div></div>`;
    root.appendChild(div);
    setTimeout(()=>{
      if(currentYear!==year||!div.isConnected)return;
      const state2w=buildRidgeState(d['2w']||[], d.bw);
      const state6m=buildRidgeState(d['6m']||[], d.bw);
      const sharedMaxY=Math.max(state2w?.maxY||0, state6m?.maxY||0, 1e-6);
      drawRidge(document.getElementById('a_'+uid), state2w, 185, sharedMaxY);
      drawRidge(document.getElementById('b_'+uid), state6m, 185, sharedMaxY);
      const controls=div.querySelector('.median-ranges');
      let selected=6;
      const ranges=[['1M',1],['3M',3],['6M',6],['12M',12],['All',0]];
      function redrawMedian(){
        const ml=d.ml||[];
        let points=ml;
        if(selected && ml.length){
          const last=new Date(ml[ml.length-1].d+'T00:00:00Z');
          const day=last.getUTCDate();
          last.setUTCDate(1);last.setUTCMonth(last.getUTCMonth()-selected);
          const end=new Date(Date.UTC(last.getUTCFullYear(),last.getUTCMonth()+1,0)).getUTCDate();
          last.setUTCDate(Math.min(day,end));
          const cutoff=last.toISOString().slice(0,10);
          points=ml.filter(p=>p.d>=cutoff);
        }
        controls.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.months)===selected));
        drawMedian(document.getElementById('m_'+uid),points);
      }
      ranges.forEach(([label,months])=>{
        const b=document.createElement('button');b.type='button';b.className='year-btn';
        b.style.padding='4px 8px';b.textContent=label;b.dataset.months=months;
        b.onclick=()=>{selected=months;redrawMedian();};controls.appendChild(b);
      });
      redrawMedian();
    },10);
  });
  filterSel.value='ALL';
}

YEARS.forEach(year=>{
  const btn=document.createElement('button');btn.type='button';btn.className='year-btn';btn.dataset.year=year;btn.textContent=year;
  btn.addEventListener('click',()=>renderYear(year));yearToggle.appendChild(btn);
});
renderYear(currentYear);

function filterCountry(val){
  document.querySelectorAll('.country').forEach(div=>{
    if(val==='ALL'||div.dataset.country===val){
      div.classList.remove('hidden');
    }else{
      div.classList.add('hidden');
    }
  });
}
</script>
