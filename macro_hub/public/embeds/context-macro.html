.5 in September, in line \nwith expansionary levels that have persisted throughout this year, and especially \nover the last four months. The new orders index was little changed at 55.5 while \nproduction rose to 59.0. The employment index fell modestly to 52.4. Prices paid \nfell slightly to 75.2 from 77.9, likely as refined energy product prices stabilized \nmostly in October. \nCiti’s view – ISM manufacturing survey data show little change in an overall strong \nbackdrop for the sector through October. This is not too surprising given consistent \nstrength in manufacturing throughout the last year, supported by AI investment \nand business tax incentives. Details like manufacturing employment remain \nstrong, suggesting another increase in manufacturing payrolls on Friday. \nBut we would watch for signs in manufacturing survey data that activity could start \nto slow into 2027. Many anecdotes in the ISM survey were mixed, citing elevated \ncosts and uncertainty but continued strength in AI-related activity. \nPotential slowing in manufacturing activity could reflect a number of headwinds. \nWhile AI-related investment is expected to remain strong, further shifts in AI-\nsentiment, which has worsened in recent weeks, could weigh on investment plans. \nEven if current investment plans proceed, this would still suggest a slowing growth \nrate of future investment. Additionally, higher rates and recently tighter financial \nconditions could weigh on non-AI related parts of the manufacturing sector, with \nChair Warsh even noting last week that AI investment is unlikely to be fully \ninsensitive to higher rates. The fading boost from tax incentives into 2027 would \nalso imply slowing investment and industrial sector activity. \nWe would watch details like ISM new orders for any early sign of an upcoming \npullback. New orders have been moving mostly sideways in recent months, \nconsistent with hard data on durable goods orders slowing modestly following very \nstrong 0687060f6ae2", "page": 1, "quote": "PBOC changes policy rate benchmark: On Friday (October 30), the PBOC \nn\nannounced changes to its open market operations, moving the policy rate \nbenchmark from the 7-day reverse repo rate (1.4%) to the overnight reverse \nrepo rate (1.25%). In our view, this is equivalent to a 5-10bp cut to front-end \ninterbank interest rates. The timing of Friday’s announcement was likely related \nto the Huafa credit risk and related mutual fund redemptions, as well as \ncontinued equity market weakness. On Sunday (November 1), media reported \nthat financial regulators, including the PBOC, will convene a meeting with major \nbanks on Monday (November 2) to discuss optimizing the relending policy for \nstock buybacks and shareholding increases, presumably to help stabilize the \nequity market. Taken together, we believe recent events show policymakers’ \nfocus on ensuring financial stability and the trend of Chinese interest rates \ngrinding lower.", "title": "China: Three things in China", "published_metadata": "2026-11-01", "date_basis": "collector_publication_date", "first_ingested": "2026-11-02T07:16:34+09:00", "paths": [""], "url": ""}], "house": "GS", "limitations": ["서로 다른 만기 기준금리의 15bp 차이를 동일 금리의 단순 인하 폭으로 해석하지 않는다. 5~10bp는 GS의 효과 추정.", "이전 원문 미대조. 사용자 검토 전 초안."], "origin": "assistant_review_of_local_reports", "prior_view_id": null, "review_status": "draft", "scope": "country_research", "summary": "PBOC가 정책금리 기준을 7일 역레포 1.4%에서 익일 역레포 1.25%로 바꾼 조치를 GS는 단기 은행간 금리 5~10bp 인하에 상응한다고 해석했다. 신용 위험·펀드 환매·주가 약세 속 금융안정과 금리 하락 추세에 초점을 둔다.", "track": "policy.reaction", "view_id": "daily20261102-cn-gs", "watch": [], "theme": "policy", "track_label": "정책 판단 조건", "scope_label": "국가별 직접 분석", "change_label": "이전 원본과 미대조", "age_days": 10, "storage_layer": "living_ib"}], "theme": "policy", "track_label": "정책 판단 조건", "history": []}, {"house": "GS", "country": "EA", "track": "growth.drivers", "conflict": false, "views": [{"analyst_questions": ["4분기 프랑스·이탈  \n0.27% in August (vs. our expectation of 0.26% prior to today’s import prices report), \ncorresponding to a year-over-year rate of +3.17%.", "title": "USA: Core Retail Sales Well Above Expectations; Boosting Q3 GDP Tracking Estimate to +3.0%; Core Import Prices Well Above Expectations; Estimating 0.27% for August Core PCE", "published_metadata": "2026-09-16", "date_basis": "collector_publication_date", "first_ingested": "2026-09-17T08:44:30+09:00", "paths": [""], "url": ""}, {"doc_id": "8e03822df693ea50e9de6c75b92ec17a24fc38d64c7c54e84b78cd1862e28eb8", "page": 2, "quote": "3. Core import prices rose 0.8%, well above expectations, and headline import prices \nincreased 0.7% in August, above expectations. Import prices for computer peripherals \nand parts rose 4.9% month-over-month, and 48.8% year-over-year, pointing to further \nupward pressure on core inflation from electronics prices this year. The international \nairfares component of import prices, which is the source data for the foreign travel \ncomponent of core PCE, increased 2.1% (SA by GS).", "title": "USA: Core Retail Sales Well Above Expectations; Boosting Q3 GDP Tracking Estimate to +3.0%; Core Import Prices Well Above Expectations; Estimating 0.27% for August Core PCE", "published_metadata": "2026-09-16", "date_basis": "collector_publication_date", "first_ingested": "2026-09-17T08:44:30+09:00", "paths": [""], "url": ""}], "house": "GS", "limitations": ["9월 16일 원문에 근거한 8월 한 달 추정과 올해 전자제품 가격 위험이다. 중장기 물가 경로 전체의 새로운 수치 전망으로 확대하지 않는다."], "origin": "assistant_review_of_local_reports", "prior_view_id": "GS-US-inflation.outlook-20260911", "review_status": "draft", "scope": "country_research", "summary": "8월 근원 수입물가가 예상보다 높고 해외여행비에 반영되는 국제항공료가 2.1% 오르자, GS는 8월 근원 PCE 전월비 추정을 0.26%에서 0.27%, 전년비 추정을 3.17%로 높였다. 전자제품 가격도 올해 근원물가의 상방 압력으로 봤다.", "track": "inflation.outlook", "view_id": "GS-US-inflation.outlook-20260916", "watch": ["US_CORE_CPI", "US_CORE_PCE"], "theme": "inflation", "track_label": "물가 경로", "scope_ ": "collector_publication_date", "first_ingested": "2026-09-09T15:09:52+09:00", "paths": [""], "url": ""}], "house": "HSBC", "limitations": [], "origin": "assistant_review_of_local_reports", "prior_view_id": null, "review_status": "draft", "scope": "country_research", "summary": "GDP가 약하면 스태그플레이션에 가까워지지만 예상보다 강하면 추가 인상이 필요할 수 있다는 조건을 제시했다.", "track": "policy.near_term", "view_id": "HSBC-AU-policy.near_term-872d75a080e2", "watch": ["AU_GDP", "AU_TRIMMED_CPI", "AU_PRODUCTIVITY", "RBA_DECISION"], "theme": "policy", "track_label": "정책금리 기본 전망", "scope_label": "국가별 직접 분석", "change_label": "이전 원본과 미대조", "age_days": 72, "storage_layer": "living_ib"}]}, {"house": "HSBC", "country": "AU", "track": "policy.reaction", "conflict": false, "views": [{"analyst_questions": ["성장 둔화 속도와 물가 기대가 추가 긴축 위험을 줄이는가?"], "assumptions": [], "change": "uncompared", "change_note": "이전 원문 직접 대조 미완료.", "country": "AU", "effective_date": "2026-11-03", "evidence": [{"doc_id": "636d5bbf8351d10da9f33508acd444b609fc0de8a99863d9f65a7100e9fcb567", "page": 1, "quote": "Facts \n- The RBA increased its cash rate by 25bp to 4.85% as expected by 34 of 37 respondents in the \nBloomberg survey (including HSBC), with the OIS market priced at an 84% chance of a 25bp hike just \nprior to the 2.30pm announcement. \n- The RBA raised its inflation forecasts and now sees annual trimmed mean inflation of 3.5% in Q2 2027 \n(previously 3.0%) and 2.9% in Q4 2027 (previously 2.6%), and headline inflation of 3.7% in Q2 2027 \n(previously 2.8%) and 2.7% in Q4 2027 (previously 2.6%).  \n- The central bank now sees annual GDP growth of 1.6% in Q4 2026 (previously 1.4%) and 1.3% in Q4 \n2027 (previously 1.6%), with the unemployment rate rising to 4.9% in Q4 2027 (previously 4.7%) and 5.1% \nin Q4 2028 (previously 4.8%).  \n- On the supply-side, the RBA now assumes annual labour productivity growth of 0.1% y-o-y in Q4 2027 \n(previously 0.6%). The RBA also raised its assumption of the NAIRU to around 4.75%. \n- The RBA’s latest business liaison noted that the share of firms expecting to increase prices is elevated \nand has increased further over recent months, with “a marked move upwards” in reported wages growth \nfrom earlier in the year. \nImplications \nToday’s hike by the RBA lifted the cash rate to its highest level since November 2008, as the central \nbank’s reaction function appears to have pivoted to more clearly focusing on getting inflation to fall. \nThe hike today is in line with the view we have held since 2 September, at which time we were the only \nrespondent in the Bloomberg survey calling for back-to-back September and November hikes (see ‘The \nRBA Observer: View change More hikes now expected’, 2 September 2026; Bloomberg, 4 September). \nWe have had the view that the RBA’s reaction function would shift in part because of concerns about the \nlength of time that inflation has been above target. As today’s post-meeting statement noted ‘the board is \nconscious of the period in which inflation has been too high’.  \nThat being said, the fact that the board vote was split, with a 6:3 vote to hike, suggests to us that although \nthe staff and the forecasts they put together, imply a stronger focus on getting inflation down, the board is \na bit more reluctant. \nThere were noticeable revisions to the forecasts. \n◆ The RBA lifted its cash rate to 4.85%, as expected, and published higher core \ninflation forecasts, suggesting a risk more rate hikes may be needed  \n◆ However, although these forecasts imply hawkishness, the monetary policy \nboard’s vote to hike was split, 6:3, suggesting some reluctance on the day    \n◆ Our view is that growth will weaken faster than the RBA is assuming, which \nwe expect to keep them from hiking again, but the risk of another hike remains", "title": "RBA Observer Update Hike delivered and still somewhat hawkish", "published_metadata": "2026-11-03", "date_basis": "collector_publication_date", "first_ingested": "2026-11-05T07:17:44+09:00", "paths": [""], "url": ""}], "house": "HSBC", "limitations": ["11월3일 정책 결정 후 견해. 기본 경로와 추가 인상 위험을 구분.", "이전 원문 미대조 uncompared. 사용자 검토 전 초안."], "origin": "assistant_review_of_local_reports", "prior_view_id": null, "review_status": "draft", "scope": "country_research", "summary": "HSBC는 성장 둔화가 RBA 예상보다 빨라 추가 인상을 막을 것으로 예상한다. 다만 높아진 근원물가 전망은 추가 인상 위험을 남기며 6대3 표결은 위원회의 일부 주저함을 보여준다고 평가했다.", "track": "policy.reaction", "view_id": "daily20261105-au-hsbc", "watch": [], "theme": "policy", "track_label": "정책 판단 조건", "scope_label": "국가별 직접 분석", "change_label": "이전 원본과 미대조", "age_days": 8, "storage_layer": "living_ib"}], "theme": "policy", "track_label": "정책 판단 조건", "history": [{"analyst_questions": ["근원물가의 분기 상승세와 다음 RBA 결정."], "assumptions": [], "change": "uncompared", "change_note": "보고서 자체의 이전 전망 언급과 별개로 이전 원문 직접 대조는 미완료.", "country": "AU", "effective_date": "2026-10-28", "evidence": [{"doc_id": "216dc1c8951ff32150fa8b39b8b32f92d775f335df9712448a3ae6bc003525ea", "page": 1, "quote": "Implications \nToday’s core inflation print was broadly in line with the market and our own expectations, confirming that \nunderlying inflation is still well above the RBA’s target band, and has picked up pace. \nThis supports our view that the RBA will be uncomfortable and will feel compelled to lift its cash rate \nfurther next week, despite having already delivered 100bp of tightening this year so far. \nWe have held this view since 2 September (see ‘The RBA Observer: View change: more hikes now \nexpected’, 2 September 2026; ‘Australian Economic Comment: Stricter focus on inflation is expected’, 7 \nSeptember 2026). At the time, we were the only one of 25 forecasters in the Bloomberg survey (on 4 \nSeptember) that were calling for sequential hikes in September and November(Bloomberg, 4 September). \nThe OIS market is 83% priced for a hike at the November meeting, as of 12.30pm Sydney time. \nAt the same time as the CPI release, the RBA Governor and senior staff appeared at a parliamentary \ntestimony. When asked about the CPI release, Deputy Governor Andrew Hauser, said ‘the CPI data today \nis too high’.  \n◆ The trimmed mean printed at 1.0% q-o-q (in line with the market and HSBC \nforecasts) and the y-o-y rate rose to 3.7% (market had 3.6%) \n◆ Core inflation is still well above the RBA’s target band, and has picked up \npace on a quarterly and y-o-y basis \n◆ We expect the RBA to deliver another 25bp hike next week, taking its cash \nrate to 4.85%, which would be its highest level since November 2008", "title": "Australian CPI Still too high and rising, we expect another RBA hike", "published_metadata": "2026-10-28", "date_basis": "collector_publication_date", "first_ingested": "2026-10-29T07:22:22+09:00", "paths": [""], "url": ""}], "house": "HSBC", "limitations": ["분기 절사평균과 월간 절사평균은 별도 지표다. 실제 인상으로 표시하지 않는다.", "이전 원문 미대조. 사용자 검토 전 초안."], "origin": "assistant_review_of_local_reports", "prior_view_id": null, "review_status": "draft", "scope": "country_research", "summary": "3분기 근원물가가 전분기비 1.0%, 전년비 3.7%로 목표범위를 웃돌고 다시 빨라져 다음 주 RBA가 25bp 추가 인상해 4.85%로 올릴 것으로 예상한다.", "track": "policy.reaction", "view_id": "daily20261029-au-hsbc", "watch": [], "theme": "policy", "track_label": "정책 판단 조건", "scope_label": "국가별 직접 분석", "change_label": "이전 원본과 미대조", "age_days": 14, "storage_layer": "living_ib"}, {"analyst_questions": [], "assumptions": [], "change": "uncompared", "change_note": "이전 저장 견해의 원본과 직접 대조하지 않았습니다.", "country": "AU", "effective_date": "2026-10-19", "evidence": [{"doc_id": "1ed8dc436dd81720400582f71f91d9c7c71a6195784b9b9ae1fd1e55a79e86f9", "page": 1, "quote": "Fiscal policy – that is, government's choices on tax and spending policies – clearly has a big impact on growth and inflation. It can also be used to redistribute across the economy. And, as we have noted repeatedly, fiscal policy settings affect the supply-side of the economy and productivity. Mone", "title": "Australian Economic Comment Fiscal and monetary coordination? More could help", , "assumptions": [], "change": "uncompared", "change_note": "이번 원문 검토이며 이전 원문 직접 대조 미완료.", "country": "EA", "effective_date": "2026-10-30", "evidence": [{"doc_id": "f5491a7cf9bbab687296f2e0a61ba78ec9a17e386160cd600d5da717e64a8e92", "page": 1, "quote": "Facts \nEurozone GDP grew by 0.4% q-o-q in the provisional release for Q3 2026, twice the pace Bloomberg \nconsensus had been looking for (HSBC: 0.2% q-o-q). This was a deceleration relative to the 0.6% \nrecorded in Q2.  \nThe headline overstates the strength however as Irish GDP was up 5.5% on the quarter, adding 0.2ppts to \ntotal eurozone growth. Excluding Ireland, growth would have been 0.2% q-o-q, the same as in Q2. \nOn an annual basis, the eurozone expanded by 1.3% compared to 1.2% recorded in the prior quarter.  \nThe preliminary flash release doesn’t contain a breakdown of growth by expenditure, but country-level \ndata and commentary point to consumer resilience on the one hand and export payback on the other. Full \nexpenditure details will be available in the third release on 7 December.  \nAcross the big 4 economies: \n◆ Germany surprised to the upside, with the third quarter growth coming in at 0.2% q-o-q (Bloomberg \nconsensus: +0.1% q-o-q, HSBC: 0.0% q-o-q), following +0.3% q-o-q in Q2. No detailed estimates \nwere published with the flash print, but Destatis mentioned that consumption expenditure was up \nwhile investment declined, and exports had slowed noticeably compared to H1. \n◆ In France, activity unexpectedly shrunk by 0.1% q-o-q following a flat second quarter. Bloomberg \nconsensus had been looking for a small plus (0.1% q-o-q). The decline reflected a fall in exports and \ninvestment while consumer spending (+0.4% q-o-q) and public consumption (+0.3% q-o-q) were \nrelatively firm (French GDP (Q3 26, 1st release), 30 October). \n◆ Italy’s GDP was flat, following 0.2% q-o-q in Q2, in an undershoot to Bloomberg consensus \nexpectations (0.1% q-o-q). Istat noted a positive contribution from do 6e8e3f", "page": 1, "quote": "Implications \nToday’s widely anticipated decision supports our base case that the BoJ will remain on hold at the \nfinal Monetary Policy Meeting (MPM) of the year on 18 December, deliver one further 25bp rate increase \non 22 January 2027 to 1.50%, and then keep rates unchanged thereafter. \nThe BoJ also announced a unanimous decision today to accelerate its exchange-traded fund (ETF) sales. \nIt plans to sell around JPY860bn of ETFs per year on a book-value basis, equivalent to 0.1% of market \ntrading value. At this pace, the BoJ could complete its ETF sales in 43 years, compared with the 112 years \npreviously estimated in September 2025, when it began selling JPY330bn of holdings annually, equivalent \nto 0.05% of market trading value. In our view, this represents another step in the BoJ’s broader \nmonetary policy normalisation campaign by reducing its large balance sheet. \nPressure on the BoJ to accelerate monetary tightening continues to build. As we highlighted in our \npreview note, the risks to our base case of a January 2027 hike increasingly point towards an earlier move \nat the December 2026 MPM. The BoJ faces pressure to keep pace with the US Federal Reserve, which \nraised rates at the September FOMC meeting. HSBC US economist Ryan Wang expects a further 25bp \nincrease in December 2026, while a wider Japan–US policy-rate differential could renew pressure on the \nyen (see FOMC Multi-Asset Reaction: Skip today, hike tomorrow, 28 October 2026).", "title": "Bank of Japan Skip today, hike the day after tomorrow", "published_metadata": "2026-10-30", "date_basis": "collector_publication_date", "first_ingested": "2026-11-01T07:16:12+09:00", "paths": [""], "url": ""}], "house": "HSBC", "limitations": ["10월30일 자료로 전일 적재 이후 확보돼 오늘 처음 검토. 12월 인상은 기본 전망이 아닌 위험 시나리오.", "이전 원문 미대조. 사용자 검토 전 초안."], "origin": "assistant_review_of_local_reports", "prior_view_id": null, "review_status": "draft", "scope": "country_research", "summary": <script>
'use strict';
const DATA=JSON.parse(document.getElementById('macroData').textContent),$=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let country=DATA.countries.some(c=>c.code==='US')?'US':DATA.countries[0]?.code;
function sources(refs){const byPage=new Map(refs.map(x=>[x.doc_id+':'+x.page,x]));return `<div class="sources">${[...byPage.values()].map(x=>`<a class="source-title" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="muted">발행 ${esc(x.published_metadata)} · ${x.page}쪽</span>`).join('<br>')}</div>`}
function quotes(refs){return `<details><summary>원문 근거 보기</summary>${refs.map(x=>`<blockquote>${esc(x.quote)}</blockquote>`).join('')}</details>`}
function context(v){const parts=[];if(v.assumptions.length)parts.push(`<p><b>핵심 전제</b> ${v.assumptions.map(esc).join(' / ')}</p>`);if(v.analyst_questions.length)parts.push(`<p><b>확인할 조건</b> ${v.analyst_questions.map(esc).join(' / ')}</p>`);return parts.length?`<div class="context">${parts.join('')}</div>`:''}
function history(g){if(!g.history.length)return '';return `<details><summary>이 쟁점의 이전 뷰 ${g.history.length}건</summary>${g.history.map(v=>`<div class="history"><b>${esc(v.effective_date)}</b><p>${esc(v.summary)}</p><div class="muted">${esc(v.change_label)} · ${esc(v.change_note)}</div>${sources(v.evidence)}${quotes(v.evidence)}</div>`).join('')}</details>`}
function view(v,g){const prior=g.history.find(x=>x.view_id===v.prior_view_id);return `<article class="view"><h3>${esc(v.track_label)}${v.track==='rates.outlook'?' · 정책금리 결정과 구분':''}</h3><div><span class="tag">검토 뷰 ${esc(v.effective_date)}</span> ${v.age_days>21?`<span class="tag old">${v.age_days}일 경과</span>`:''}${g.conflict?' <span class="tag conflict">같은 날짜의 복수 뷰</span>':''}</div><p>${esc(v.summary)}</p>${context(v)}${prior?`<div class="context"><p><b>이전 → 현재</b> ${esc(v.change_label)}</p><p>${esc(prior.effective_date)}: ${esc(prior.summary)}</p><p>${esc(v.change_note)}</p></div>`:`<div class="muted">${esc(v.change_label)}${v.change_note?' · '+esc(v.change_note):''}</div>`}${v.limitations.map(t=>`<div class="limit">유의: ${esc(t)}</div>`).join('')}<div class="scope">${esc(v.scope_label)}${v.storage_layer==='calendar_supplement'?' · 지표 분석에서 보강한 저장 뷰':''}</div>${sources(v.evidence)}${quotes(v.evidence)}</article>`}
'use strict';
const PERSONAL_KEY='qae.personalViews.v1';
const PERSONAL_REGIONS=[{code:'GLOBAL',label:'글로벌'},{code:'US',label:'미국'},{code:'EA',label:'유로존'},{code:'JP',label:'일본'},{code:'CN',label:'중국'},{code:'KR',label:'한국'},{code:'GB',label:'영국'},{code:'CA',label:'캐나다'},{code:'AU',label:'호주'},{code:'EM',label:'신흥국'}];

const personalAllowed=new Set(DATA.countries.map(c=>c.code));
function validatePersonal(value){
  if(!value||value.schema_version!==1||!value.regions||typeof value.regions!=='object'||Array.isArray(value.regions))throw new Error('내 뷰 백업 형식을 확인하세요.');
  const result={schema_version:1,regions:{}};
  for(const [code,entry]of Object.entries(value.regions)){
    if(!personalAllowed.has(code)||!entry||typeof entry.text!=='string'||entry.text.length>30000||typeof entry.updatedAt!=='string'||!Number.isFinite(Date.parse(entry.updatedAt)))throw new Error('리전 또는 입력 내용의 형식이 올바르지 않습니다.');

function readPersonal(){const raw=localStorage.getItem(PERSONAL_KEY);return raw?validatePersonal(JSON.parse(raw)):{schema_version:1,regions:{}};}

function showPersonalPreview(){
  const entry=personalState.regions[country];

  $('personalSaveStatus').classList.toggle('save-error',!!personalError);

function renderPersonal(){
  $('personalRegion').textContent=(DATA.countries.find(c=>c.code===country)?.label||country)+' · 내 뷰';

}
function savePersonal(code,text){
  if(!personalAllowed.has(code)||typeof text!=='string'||text.length>30000)throw new Error('입력 내용을 확인하세요.');

  personalState=next;personalError='';

$('personalText').addEventListener('input',()=>{

$('personalApply').addEventListener('click',()=>{

    const state=readPersonal();
    const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
    const link=document.createElement('a');link.href=url;link.download='QAE_내뷰_'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(error){personalError='백업 실패: '+error.message;showPersonalPreview();}
});
$('personalImport').addEventListener('change',async event=>{
  const file=event.target.files[0];if(!file)return;
  try{
    if(file.size>2000000)throw new Error('백업 파일이 너무 큽니다.');
    const incoming=validatePersonal(JSON.parse(await file.text()));
    const next=readPersonal();
    for(const[code,entry]of Object.entries(incoming.regions)){
      const existing=next.regions[code];
      if(!existing||Date.parse(entry.updatedAt)>Date.parse(existing.updatedAt))next.regions[code]=entry;
    }
    localStorage.setItem(PERSONAL_KEY,JSON.stringify(next));personalState=next;personalError='';renderPersonal();
    $('personalSaveStatus').textContent='백업을 불러왔습니다. 리전별 최신 수정 내용을 유지합니다.';
  }catch(error){personalError='불러오기 실패: '+error.message;showPersonalPreview();}
  event.target.value='';
});
window.addEventListener('storage',event=>{if(event.key===PERSONAL_KEY){try{personalState=readPersonal();personalError='';renderPersonal();}catch(error){personalError=error.message;showPersonalPreview();}}});

function render(){
  renderPersonal();
  const groups=DATA.groups.filter(g=>g.country===country),current=groups.flatMap(g=>g.views);
  $('countries').innerHTML=DATA.countries.map(c=>`<button data-country="${esc(c.code)}" aria-pressed="${c.code===country}">${esc(c.label)}</button>`).join('');
  $('countryTitle').textContent=DATA.countries.find(c=>c.code===country)?.label||'';
  $('counts').textContent=`저장된 현재 뷰 ${current.length}건 · 이전 뷰 ${groups.reduce((n,g)=>n+g.history.length,0)}건`;
  $('rows').innerHTML=DATA.houses.map(h=>`<tr><th scope="row">${esc(h)}</th>${Object.keys(DATA.themes).map(theme=>{const chosen=groups.filter(g=>g.house===h&&g.theme===theme);return `<td>${chosen.length?chosen.map(g=>g.views.map(v=>view(v,g)).join('')+history(g)).join(''):'<p class="empty">이 영역의 저장된 직접 뷰가 없습니다.</p>'}</td>`}).join('')}</tr>`).join('');
  const fs=DATA.forecasts.filter(f=>f.country===country);
  $('forecasts').innerHTML=fs.length?`<p class="muted">아래는 해당 작성일의 사전 전망입니다. 현재 실제값이나 새 전망으로 해석하지 않습니다.</p><ul class="forecast-list">${fs.map(f=>`<li><b>${esc(f.house)}</b> · ${esc(f.indicator)} · 대상 ${esc(f.reference_period)} · ${esc(f.value)} ${esc(f.unit)}<br><span class="muted">작성 ${esc(f.as_of)} · 시나리오 ${esc(f.scenario)} ${f.conflict?'· 복수 전망':''}</span>${sources(f.evidence)}${quotes(f.evidence)}</li>`).join('')}</ul>`:'<p class="empty">이 지역의 저장된 수치 전망은 없습니다.</p>';
}
$('dateNote').textContent=`저장 뷰 최신 기준일 ${DATA.meta.latest_view_date} · 검색 DB의 최신 보고서 ${DATA.meta.latest_indexed_report_date} · 화면 구성 ${DATA.meta.as_of}`;
$('scopeNote').textContent=DATA.meta.note+' IB 뷰는 사용자 검토 전 초안이며, 내 뷰는 직접 작성한 의견입니다.';
$('method').innerHTML=`<p>각 IB의 견해를 국가·쟁점별로 묶었습니다. 해당 쟁점의 마지막 저장 뷰와 전제·위험·변경 이력을 보여주며, 하우스 간 의견을 임의의 합의로 합치지 않았습니다.</p><p>Growth에는 성장·소비·고용·주택·생산성, Inflation에는 물가 경로·지표 전망·에너지 위험을 모았습니다. 통화정책에는 기본 금리 경로·정책 판단 조건을 담고 시장금리 전망은 별도로 표시합니다. 에너지 위험은 근원물가 전망과 같은 뜻이 아닙니다.</p><p>유로존 뷰를 독일·프랑스·이탈리아의 독립 뷰로 복제하지 않습니다. 자료가 없는 칸은 공백으로 두며, 오래된 뷰의 경과일 표시는 만료나 전망 변경을 의미하지 않습니다.</p><p>${DATA.meta.current_views}개 현재 뷰 · ${DATA.meta.prior_views}개 과거 뷰 · ${DATA.meta.source_documents}개 근거 보고서. 최근 지표별 요약·코멘트는 상단의 별도 메뉴에 그대로 남아 있습니다.</p>`;
$('countries').addEventListener('click',e=>{const b=e.target.closest('[data-country]');if(b&&DATA.countries.some(c=>c.code===b.dataset.country)){country=b.dataset.country;render()}});
render();
</script><script>
(()=>{const m=DATA.meta;const reviewed=m.commentary_reviewed_on||m.latest_view_date;const days=reviewed?Math.floor((Date.now()-Date.parse(reviewed+'T00:00:00+09:00'))/86400000):null;if(days===null||days>3){const el=document.createElement('div');el.style.cssText='padding:14px;background:#fff2cc;color:#6b4300;border:1px solid #ddad32';el.textContent=reviewed?'검토 자료일 '+reviewed+' · '+days+'일 경과. 화면 생성일과 별개이며 최신 검토 여부를 확인하세요.':'검토 자료일 미확인. 최신 업데이트 여부를 확인하세요.';document.body.prepend(el);}})();
</script>
</body></html>
