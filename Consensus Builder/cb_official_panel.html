<style>
.cb-official{background:#fff;border:2px solid #b7d1c8;border-radius:12px;padding:20px;margin:14px 0 24px}.cb-official h3{font:600 19px Arial,sans-serif;color:#174d47;margin:0 0 8px}.cb-official p{font-size:13px;line-height:1.7;color:#536d71;margin:6px 0 16px}.cb-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.cb-card{border:1px solid #d9e5df;border-radius:8px;padding:15px;min-width:0}.cb-card h4{margin:0;font-size:15px;color:#244952}.cb-value{font:700 30px Arial,sans-serif;margin:10px 0;color:#174d47}.cb-value small{font-size:12px;font-weight:400;color:#667c80}.cb-card svg{display:block;width:100%;height:auto}.cb-meta{font-size:11px;line-height:1.8;color:#6b7d7e;overflow-wrap:anywhere}.cb-tag{display:inline-block;background:#e3f0e9;color:#25604e;border-radius:5px;padding:4px 8px;font-size:12px;margin-right:8px}.self-label{margin:18px 0 10px;color:#795c2a;font-size:16px;font-weight:600}.cb-warning{color:#927022;font-size:12px}
</style>
<script id="cb-official-data" type="application/json">__CB_DATA__</script>
<script>
(()=>{
const official=JSON.parse(document.getElementById('cb-official-data').textContent);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urls={US:'https://www.federalreserve.gov/faqs/economy_14419.htm',Australia:'https://www.rba.gov.au/inflation/measures-cpi.html',Canada:'https://www.bankofcanada.ca/rates/indicators/key-variables/key-inflation-indicators-and-the-target-range/',Japan:'https://www.boj.or.jp/en/research/research_data/cpi/index.htm',Eurozone:'https://data.ecb.europa.eu/key-figures/inflation-and-other-prices/inflation',Germany:'https://data.ecb.europa.eu/key-figures/inflation-and-other-prices/inflation',France:'https://data.ecb.europa.eu/key-figures/inflation-and-other-prices/inflation',UK:'https://www.bankofengland.co.uk/monetary-policy/inflation',Korea:'https://www.bok.or.kr/eng/main/contents.do?menuNo=400015',China:'http://www.stats.gov.cn/english/'};
const role={US:'Fed · 정책목표는 Headline PCE, 기조 추세는 Core PCE. Dallas 절사평균은 보조지표입니다.',Australia:'RBA · 목표는 Headline CPI. 공식 기조물가의 월간·분기 계열을 구분합니다.',Canada:'BoC · 목표는 Headline CPI. CPI-trim·CPI-median은 주요 기조물가 참고지표입니다.',Japan:'BoJ · 목표는 Headline CPI. 신선식품 제외 CPI와 BoJ 분포 기반 지표를 함께 봅니다.',Eurozone:'ECB · 목표는 유로존 Headline HICP. 식품·에너지 제외 HICP는 기조물가 참고지표입니다.',Germany:'ECB·Bundesbank · 정책목표는 유로존 전체 HICP. 아래는 독일 기조물가입니다.',France:'ECB·Banque de France · 정책목표는 유로존 전체 HICP. 아래는 프랑스 기조물가입니다.',UK:'BoE · 정책목표는 CPI. 서비스 물가는 지속성을 판단하는 참고지표입니다.',Korea:'한국은행 · 정책목표는 CPI. 식료품·에너지 제외 CPI는 기조물가 참고지표입니다.',China:'PBoC · CPI·PPI 등 여러 물가 흐름을 함께 관찰합니다. 아래는 식품·에너지 제외 CPI입니다.'};
function chart(points){
 const p=points.slice(-36),w=360,h=155,L=35,R=12,T=12,B=28,lo=Math.floor(Math.min(...p.map(v=>v[1]))*2)/2-.25,hi=Math.ceil(Math.max(...p.map(v=>v[1]))*2)/2+.25;
 const X=i=>L+i/Math.max(1,p.length-1)*(w-L-R),Y=v=>h-B-(v-lo)/(hi-lo)*(h-T-B);
 let s='';for(let i=0;i<3;i++){let v=lo+(hi-lo)*i/2;s+=`<line x1="${L}" y1="${Y(v)}" x2="${w-R}" y2="${Y(v)}" stroke="#e3eae7"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#718582">${v.toFixed(1)}</text>`;}
 s+=`<polyline fill="none" stroke="#237c75" stroke-width="2.4" points="${p.map((v,i)=>X(i)+','+Y(v[1])).join(' ')}"/>`;
 [0,p.length-1].forEach(i=>{s+=`<text x="${X(i)}" y="${h-5}" text-anchor="${i?'end':'start'}" font-size="11" fill="#718582">${p[i][0].slice(0,7)}</text>`});
 return `<svg role="img" aria-label="공식 지표 전년비 추이" viewBox="0 0 ${w} ${h}">${s}</svg>`;
}
document.querySelectorAll('.country').forEach(container=>{
 const c=container.dataset.country,series=official.countries[c]||[],panel=document.createElement('section');panel.className='cb-official';
 panel.innerHTML=`<h3><span class="cb-tag">공식 발표 계열</span>중앙은행 물가 참고지표</h3><p>${role[c]||''} <a href="${urls[c]}" target="_blank" rel="noopener">공식 설명 ↗</a><br>Haver API 조회: ${escape(official.retrievedAt.slice(0,16).replace('T',' '))} KST · 값은 전년비 % · 원지수 계열은 동일 월의 12개월 전 대비로 환산했습니다.</p><div class="cb-cards">${series.map(s=>{
 if(!s.points.length)return `<article class="cb-card"><h4>${escape(s.name)}</h4><p>관측값 조회 불가</p></article>`;
 const z=s.points.at(-1),monthsOld=(new Date().getFullYear()*12+new Date().getMonth())-(Number(z[0].slice(0,4))*12+Number(z[0].slice(5,7))-1);
 return `<article class="cb-card"><h4>${escape(s.name)}</h4><div class="cb-value">${z[1].toFixed(2)}% <small>${z[0].slice(0,7)} · ${s.frequency==='Q'?'분기':'월간'}</small></div>${chart(s.points)}<div class="cb-meta">${escape(s.ticker)} · ${s.kind==='index'?'공식 원지수 → 전년비 환산':'공급된 공식 전년비 계열'}<br>${s.points[0][0].slice(0,7)}부터 ${s.points.length}개 관측값</div>${monthsOld>3?'<div class="cb-warning">관측월이 오래된 계열입니다. 최신월과 혼동하지 마세요.</div>':''}</article>`;
 }).join('')}</div>`;
 container.querySelector('.ctitle').after(panel);
 if(container.querySelector('canvas[id^="r_"]')){const label=document.createElement('div');label.className='self-label';label.textContent='자체 계산 · 품목 개수 기준 분포 통계 (공식 기조물가와 계산 방식이 다릅니다)';panel.after(label);}
});
})();
</script>
